name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate repository invariants
        run: python scripts/validate_repo.py

      - name: Validate Agent Skills specification
        run: |
          for skill in skills/*; do
            agentskills validate "$skill"
          done

      - name: Verify Skills CLI discovery
        run: |
          npx --yes skills@1.5.25 add . --list | tee /tmp/skills-list.txt
          grep -q "codex-staff" /tmp/skills-list.txt
