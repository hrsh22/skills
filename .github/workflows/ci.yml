name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests

      - name: Validate repository invariants
        run: python scripts/validate_repo.py

      - name: Validate Agent Skills specification
        run: |
          for skill_file in skills/*/SKILL.md; do
            agentskills validate "$(dirname "$skill_file")"
          done

      - name: Verify Skills CLI discovery
        shell: bash
        run: |
          npx --yes skills@1.5.25 add . --list | tee /tmp/skills-list.txt
          python - <<'PY'
          import re
          from pathlib import Path

          ansi_escape = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          output = ansi_escape.sub("", Path("/tmp/skills-list.txt").read_text())
          listed = {
              line.strip().strip("│").strip()
              for line in output.splitlines()
          }
          expected = {
              skill_file.parent.name
              for skill_file in Path("skills").glob("*/SKILL.md")
          }
          missing = sorted(expected - listed)
          if missing:
              raise SystemExit(
                  "Skills CLI did not list: " + ", ".join(missing)
              )
          PY
