name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository tests
        run: python -m unittest discover -s tests

      - name: Validate release identity and repository invariants
        run: python scripts/validate_repo.py --tag "$GITHUB_REF_NAME"

      - name: Validate Agent Skills specification
        run: |
          for skill_file in skills/*/SKILL.md; do
            agentskills validate "$(dirname "$skill_file")"
          done

      - name: Verify Skills CLI discovery
        shell: bash
        run: |
          npx --yes skills@1.5.25 add . --list | tee /tmp/skills-list.txt
          python - <<'PY'
          import re
          from pathlib import Path

          ansi_escape = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          output = ansi_escape.sub("", Path("/tmp/skills-list.txt").read_text())
          listed = {
              line.strip().strip("│").strip()
              for line in output.splitlines()
          }
          expected = {
              skill_file.parent.name
              for skill_file in Path("skills").glob("*/SKILL.md")
          }
          missing = sorted(expected - listed)
          if missing:
              raise SystemExit(
                  "Skills CLI did not list: " + ", ".join(missing)
              )
          PY

      - name: Package source
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/hrsh22-skills-${GITHUB_REF_NAME}.zip" HEAD
          cd dist
          sha256sum "hrsh22-skills-${GITHUB_REF_NAME}.zip" > "hrsh22-skills-${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
