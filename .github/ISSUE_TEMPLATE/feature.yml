name: Skill proposal
description: Propose a focused skill or behavioral improvement.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring agent failure or workflow gap should this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe an observable successful outcome rather than exact wording.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility boundary
      description: Which hosts, models, tools, or permissions does this require?
    validations:
      required: true
